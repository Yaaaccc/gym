name: 记录实时人数

on:
  schedule:
    - cron: "*/5 * * * *" # 每 5 分钟一次;想改频率改这里,如 */15
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 请求接口并写入数据
        run: python3 poll.py

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no change" || (git commit -m "记录 $(TZ=Asia/Shanghai date '+%F %H:%M')" && git push)
