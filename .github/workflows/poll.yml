name: 记录实时人数

on:
  schedule:
    - cron: "*/5 * * * *" # 兜底;主要靠每轮任务结束时自动触发下一轮
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write
  actions: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 记录开始时间
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: 请求接口并写入数据(任务内每 30 秒一条,共 8 条)
        run: python3 poll.py

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no change" || (git commit -m "记录 $(TZ=Asia/Shanghai date '+%F %H:%M')" && git push)

      - name: 触发下一轮 + 刷新网页(重试 3 次,防偶发失败断链)
        if: always()
        run: |
          REMAIN=$((JOB_START + 270 - $(date +%s)))
          if [ "$REMAIN" -gt 0 ]; then sleep "$REMAIN"; fi
          for i in 1 2 3; do
            if gh workflow run poll.yml --repo Yaaaccc/gym --ref main; then break; fi
            echo "第 $i 次触发失败,20 秒后重试"; sleep 20
          done
          gh workflow run deploy.yml --repo Yaaaccc/gym --ref main || echo "部署触发失败,交给定时兜底"
        env:
          GH_TOKEN: ${{ github.token }}
