<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虾健健 · 实时人数</title>
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.1/echarts.min.js"></script>
<script>window.echarts || document.write('<script src="https://unpkg.com/echarts@5.5.1/dist/echarts.min.js"><\/script>')</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2937; padding: 20px 14px 40px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header { margin-bottom: 16px; }
  header h1 { font-size: 22px; }
  header .sub { color: #6b7280; font-size: 13px; margin-top: 4px; }
  .cards { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .card {
    background: #fff; border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .card .label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .card.hero { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
  .card.hero .label { color: rgba(255,255,255,.85); }
  .card.hero .big { font-size: 44px; font-weight: 700; line-height: 1.1; }
  .card.hero .big small { font-size: 16px; font-weight: 400; margin-left: 4px; }
  .card.hero .upd { font-size: 11px; color: rgba(255,255,255,.8); margin-top: 6px; }
  .card.hero .crowd { margin-top: 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .card.hero .crowd .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .card .mid { font-size: 22px; font-weight: 600; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .toolbar button {
    border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 999px;
    padding: 6px 16px; font-size: 13px; cursor: pointer;
  }
  .toolbar button.active { background: #1f2937; color: #fff; border-color: #1f2937; }
  .toolbar .hint { font-size: 12px; color: #9ca3af; margin-left: auto; }
  .panel { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 14px; }
  .panel h3 { font-size: 14px; color: #374151; margin-bottom: 8px; }
  #chart1 { height: 340px; }
  #chart2 { height: 240px; }
  .empty { text-align: center; color: #9ca3af; padding: 60px 0; font-size: 14px; }
  footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 8px; line-height: 1.8; }
  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr 1fr; }
    .card.hero { grid-column: 1 / -1; }
    #chart1 { height: 280px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏋️ 虾健健 24H · 实时人数</h1>
    <div class="sub">南京仙林大学城店(SZY00087)· GitHub Actions 约每 30 秒自动记录</div>
  </header>

  <div class="cards">
    <div class="card hero">
      <div class="label">当前在店</div>
      <div class="big"><span id="cur">--</span><small>人</small></div>
      <div class="upd" id="upd">加载中…</div>
      <div class="crowd" id="crowd" style="display:none"></div>
    </div>
    <div class="card"><div class="label">今日峰值</div><div class="mid" id="peak">--</div></div>
    <div class="card"><div class="label">温度</div><div class="mid" id="temp">--</div></div>
    <div class="card"><div class="label">湿度</div><div class="mid" id="hum">--</div></div>
  </div>

  <div class="toolbar" id="ranges">
    <button data-range="today" class="active">今天</button>
    <button data-range="7d">近 7 天</button>
    <button data-range="30d">近 30 天</button>
    <button data-range="all">全部</button>
    <button data-range="multi">多日对比</button>
    <button id="cmpBtn">对比上周</button>
    <button id="avgBtn" class="active">历史平均·预测</button>
    <span class="hint">当前人数实时直读 · 曲线每 2 分钟更新</span>
  </div>

  <div class="panel">
    <div id="chart1"></div>
    <div class="empty" id="empty" style="display:none">还没有数据,等 GitHub Actions 跑一次后再刷新页面</div>
  </div>

  <div class="panel">
    <h3>🌡️ 店内环境</h3>
    <div id="chart2"></div>
  </div>

  <div class="panel">
    <h3>📅 一周高峰热力图 <span style="color:#9ca3af;font-weight:400;font-size:12px">颜色越红越挤 · 数据越多越准</span></h3>
    <div id="chart3" style="height:300px"></div>
    <div class="empty" id="heatEmpty" style="display:none">数据积累中,明天再来看</div>
  </div>

  <footer>
    数据来源:虾健健小程序公开接口 · 由 GitHub Actions 自动采集<br>
    仅用于个人观察客流,请勿公开传播数据
  </footer>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var range = 'today';
  var recent = [];
  var full = null;
  var chart1 = echarts.init($('#chart1'));
  var chart2 = echarts.init($('#chart2'));
  var heatChart = echarts.init($('#chart3'));
  var API_URL = 'https://xjj.cpc-api.fitron.vip/v1/user/stores/SZY00087/live-status';
  var lastLiveOk = 0; // 最近一次实时直读成功的时间
  var compareOn = false; // 是否叠加上周同期曲线
  var avgOn = true; // 是否显示历史同时段平均(预测)曲线
  var CROWD = [ // 拥挤度阈值:30-50 轻微 / 50-80 中等 / 80+ 极度
    { min: 80, t: '极度拥挤', lab: '80+ 极度拥挤', dot: '#ef4444', band: 'rgba(239,68,68,.08)', deep: '#b91c1c' },
    { min: 50, t: '中等拥挤', lab: '50-80 中等拥挤', dot: '#fb923c', band: 'rgba(251,146,60,.08)', deep: '#c2410c' },
    { min: 30, t: '轻微拥挤', lab: '30-50 轻微拥挤', dot: '#facc15', band: 'rgba(250,204,21,.09)', deep: '#a16207' }
  ];
  function crowdLevel(n) {
    if (n == null) return { t: '', dot: '' };
    for (var i = 0; i < CROWD.length; i++) if (n >= CROWD[i].min) return CROWD[i];
    return { t: '舒适', dot: '#34d399' };
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(d) {
    var sameDay = d.toDateString() === new Date().toDateString();
    return sameDay
      ? pad(d.getHours()) + ':' + pad(d.getMinutes())
      : (d.getMonth() + 1) + '/' + d.getDate() + ' 周' + '日一二三四五六'.charAt(d.getDay()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function dayAxisLabel(v) {
    var d = new Date(v);
    if (d.getHours() === 0 && d.getMinutes() === 0) {
      return (d.getMonth() + 1) + '-' + pad(d.getDate()) + '\n周' + '日一二三四五六'.charAt(d.getDay());
    }
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function nearestVal(data, x, tol) {
    // data: 按 x 升序的 [[x, v], ...];返回距 x 最近的值,超出 tol 返回 null
    if (!data || !data.length) return null;
    var a = 0, b = data.length - 1, best = -1, bd = Infinity;
    while (a <= b) {
      var m = (a + b) >> 1;
      var dx = Math.abs(data[m][0] - x);
      if (dx < bd) { bd = dx; best = m; }
      if (data[m][0] < x) a = m + 1; else b = m - 1;
    }
    if (best < 0 || bd > tol) return null;
    return data[best][1];
  }
  function startOfToday() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }

  function loadRecent() {
    return fetch('data/recent.json?t=' + Date.now())
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (arr) { if (Array.isArray(arr)) recent = arr; })
      .catch(function () {});
  }
  function loadFull() {
    if (full) return Promise.resolve();
    return fetch('data/history.jsonl?t=' + Date.now())
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (txt) {
        full = txt.split('\n').filter(function (l) { return l.trim(); })
          .map(function (l) { try { return JSON.parse(l); } catch (e) { return null; } })
          .filter(Boolean);
      })
      .catch(function () { full = []; });
  }

  function currentData() {
    if (range === 'all') return full || recent;
    if (range === 'today') return recent.filter(function (r) { return new Date(r.ts).getTime() >= startOfToday(); });
    var days = range === '7d' ? 7 : 30;
    return recent.filter(function (r) { return new Date(r.ts).getTime() >= Date.now() - days * 864e5; });
  }

  function render() {
    var data = currentData();
    var valid = data.filter(function (r) { return r.count != null; });
    var last = valid[valid.length - 1];

    if (Date.now() - lastLiveOk < 90 * 1000) {
      // 实时直读正常,hero 卡片交给 liveTick 维护,这里不覆盖
    } else if (last) {
      $('#cur').textContent = last.count;
      $('#upd').textContent = '更新于 ' + fmt(new Date(last.ts));
      $('#temp').textContent = last.temp != null ? last.temp + '℃' : '--';
      $('#hum').textContent = last.humidity != null ? last.humidity + '%' : '--';
      var cl = crowdLevel(last.count);
      var c = $('#crowd');
      c.style.display = 'flex';
      c.innerHTML = '<span class="dot" style="background:' + cl.dot + '"></span>' + cl.t;
    } else {
      $('#cur').textContent = '--';
      $('#upd').textContent = '暂无数据';
      $('#crowd').style.display = 'none';
    }
    var todayValid = recent.filter(function (r) { return r.count != null && new Date(r.ts).getTime() >= startOfToday(); });
    $('#peak').textContent = todayValid.length ? Math.max.apply(null, todayValid.map(function (r) { return r.count; })) + ' 人' : '--';

    $('#empty').style.display = valid.length ? 'none' : 'block';

    var areaColor = new echarts.graphic.LinearGradient(0, 0, 0, 1, [
      { offset: 0, color: 'rgba(16,185,129,.28)' },
      { offset: 1, color: 'rgba(16,185,129,0)' }
    ]);
    var seriesList = [];
    var todayKey = dateKeyOf(new Date());
    var fixedDay = (range === 'today' || range === 'multi');
    if (range === 'multi') {
      buildMultiSeries(seriesList, todayKey);
    } else {
    seriesList.push({
      name: '在店人数', type: 'line', smooth: true, showSymbol: valid.length < 60,
      data: valid.map(function (r) { return [new Date(r.ts).getTime(), r.count]; }),
      lineStyle: { width: 2.5, color: '#10b981' },
      itemStyle: { color: '#10b981' },
      areaStyle: { color: areaColor },
      markPoint: {
        symbolSize: 50, itemStyle: { color: '#10b981' },
        label: { color: '#fff', fontSize: 12 },
          data: valid.length ? [{ type: 'max', name: '峰值' }] : []
        }
      });
    if (compareOn && range === 'today') {
      var t0 = startOfToday();
      var prev = recent.filter(function (r) {
        if (r.count == null) return false;
        var t = new Date(r.ts).getTime();
        return t >= t0 - 7 * 864e5 && t < t0 + 24 * 3600e3 - 7 * 864e5;
      });
      if (prev.length) {
        seriesList.push({
          name: '上周同期', type: 'line', smooth: true, showSymbol: false,
          data: prev.map(function (r) { return [new Date(r.ts).getTime() + 7 * 864e5, r.count]; }),
          lineStyle: { width: 2, color: '#9ca3af', type: 'dashed' },
          itemStyle: { color: '#9ca3af' }
        });
      }
    }
    if (avgOn && range === 'today') {
      var t0b = startOfToday();
      var sums = {}, cnts = {};
      recent.forEach(function (r) {
        if (r.count == null) return;
        var t = new Date(r.ts).getTime();
        if (t >= t0b) return; // 排除今天,只看历史
        var d = new Date(r.ts);
        var slot = d.getHours() * 2 + Math.floor(d.getMinutes() / 30); // 半小时一格
        sums[slot] = (sums[slot] || 0) + r.count;
        cnts[slot] = (cnts[slot] || 0) + 1;
      });
      var pred = [];
      for (var slot = 0; slot < 48; slot++) {
        if (cnts[slot]) {
          pred.push([t0b + slot * 1800e3 + 900e3, Math.round(sums[slot] / cnts[slot] * 10) / 10]);
        }
      }
      if (pred.length) {
        seriesList.push({
          name: '历史平均·预测', type: 'line', smooth: true, showSymbol: false,
          data: pred,
          lineStyle: { width: 2, color: '#f59e0b', type: 'dotted' },
          itemStyle: { color: '#f59e0b' },
          _tol: 16 * 60e3 // 预测线 30 分钟一个点,放宽最近值容差
        });
      }
    }
    }

    // 拥挤度参考带(数据达到该区间才显示对应色带)
    var dataMax = 0;
    seriesList.forEach(function (s) {
      s.data.forEach(function (p) { if (p[1] > dataMax) dataMax = p[1]; });
    });
    if (seriesList.length) {
      var areas = [];
      for (var ci = 0; ci < CROWD.length; ci++) {
        var lo = CROWD[ci].min;
        var hi = ci === 0 ? 140 : CROWD[ci - 1].min;
        if (dataMax >= lo) {
          areas.push([
            { yAxis: lo, itemStyle: { color: CROWD[ci].band }, label: { position: 'insideTopRight', color: CROWD[ci].deep, fontSize: 10, formatter: CROWD[ci].lab } },
            { yAxis: hi }
          ]);
        }
      }
      seriesList[0].markArea = { silent: true, data: areas };
    }
    chart1.setOption({
      grid: { left: 44, right: 24, top: 42, bottom: 44 },
      legend: { show: seriesList.length > 1, top: 0, right: 8, type: 'scroll', itemWidth: 20, textStyle: { fontSize: 11 } },
      tooltip: {
        trigger: 'axis',
        formatter: function (ps) {
          if (!ps.length) return '';
          var x = ps[0].value[0];
          var html = [fmt(new Date(x))];
          for (var i = 0; i < seriesList.length; i++) {
            var s = seriesList[i];
            var v = nearestVal(s.data, x, s._tol || 10 * 60e3);
            var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + (s.itemStyle ? s.itemStyle.color : '#10b981') + ';margin-right:5px"></span>';
            html.push(dot + s.name + ': <b>' + (v == null ? '--' : v) + '</b> 人');
          }
          return html.join('<br/>');
        }
      },
      xAxis: {
        type: 'time', axisLabel: { hideOverlap: true, formatter: dayAxisLabel },
        min: fixedDay ? new Date(todayKey + 'T00:00:00+08:00').getTime() : null,
        max: fixedDay ? new Date(todayKey + 'T00:00:00+08:00').getTime() + 24 * 3600e3 : null
      },
      yAxis: { type: 'value', minInterval: 1 },
      dataZoom: [{ type: 'inside' }],
      series: seriesList
    }, true);

    var env = data.filter(function (r) { return r.temp != null || r.humidity != null; });
    chart2.setOption({
      grid: { left: 44, right: 44, top: 36, bottom: 44 },
      tooltip: { trigger: 'axis' },
      legend: { top: 0 },
      xAxis: { type: 'time', axisLabel: { hideOverlap: true, formatter: dayAxisLabel } },
      yAxis: [
        { type: 'value', name: '℃', scale: true },
        { type: 'value', name: '%', max: 100, scale: true }
      ],
      series: [
        {
          name: '温度', type: 'line', smooth: true, showSymbol: env.length < 60, yAxisIndex: 0,
          data: env.filter(function (r) { return r.temp != null; })
            .map(function (r) { return [new Date(r.ts).getTime(), r.temp]; }),
          lineStyle: { width: 2, color: '#f59e0b' }, itemStyle: { color: '#f59e0b' }
        },
        {
          name: '湿度', type: 'line', smooth: true, showSymbol: env.length < 60, yAxisIndex: 1,
          data: env.filter(function (r) { return r.humidity != null; })
            .map(function (r) { return [new Date(r.ts).getTime(), r.humidity]; }),
          lineStyle: { width: 2, color: '#3b82f6' }, itemStyle: { color: '#3b82f6' }
        }
      ]
    }, true);

    renderHeat();
  }

  function dateKeyOf(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function buildMultiSeries(seriesList, todayKey) {
    var groups = {};
    recent.forEach(function (r) {
      if (r.count == null) return;
      var day = r.ts.slice(0, 10);
      (groups[day] = groups[day] || []).push(r);
    });
    var dayKeys = Object.keys(groups).sort().slice(-7); // 最近 7 天
    var palette = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#06b6d4', '#84cc16', '#ef4444'];
    var t0m = new Date(todayKey + 'T00:00:00+08:00').getTime();
    dayKeys.forEach(function (day, i) {
      var ds = new Date(day + 'T00:00:00+08:00').getTime();
      var isToday = day === todayKey;
      var color = isToday ? '#10b981' : palette[i % palette.length];
      var wd = '日一二三四五六'.charAt(new Date(day + 'T00:00:00+08:00').getDay());
      seriesList.push({
        name: day.slice(5) + ' 周' + wd,
        type: 'line', smooth: true, showSymbol: false,
        data: groups[day].map(function (r) {
          return [t0m + (new Date(r.ts).getTime() - ds), r.count];
        }),
        lineStyle: { width: isToday ? 2.5 : 1.8, color: color },
        itemStyle: { color: color }
      });
    });
  }

  function renderHeat() {
    var days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    var sum = {}, cnt = {};
    recent.forEach(function (r) {
      if (r.count == null) return;
      var d = new Date(r.ts);
      var row = (d.getDay() + 6) % 7; // 周一在最上
      var k = row + ':' + d.getHours();
      sum[k] = (sum[k] || 0) + r.count;
      cnt[k] = (cnt[k] || 0) + 1;
    });
    var data = [];
    for (var h = 0; h < 24; h++) {
      for (var row = 0; row < 7; row++) {
        var k = row + ':' + h;
        if (cnt[k]) {
          var avg = Math.round(sum[k] / cnt[k] * 10) / 10;
          data.push([h, row, avg]);
        }
      }
    }
    document.getElementById('heatEmpty').style.display = data.length ? 'none' : 'block';
    heatChart.setOption({
      grid: { left: 56, right: 16, top: 12, bottom: 58 },
      tooltip: {
        formatter: function (p) {
          var n = cnt[p.value[1] + ':' + p.value[0]] || 0;
          return days[p.value[1]] + ' ' + p.value[0] + ' 点<br/>平均在店 <b>' + p.value[2] + '</b> 人 · ' + crowdLevel(p.value[2]).t + '(样本 ' + n + ' 次)';
        }
      },
      xAxis: {
        type: 'category',
        data: Array.apply(null, Array(24)).map(function (_, i) { return i; }),
        axisLabel: { interval: 1, formatter: '{value}时' }
      },
      yAxis: { type: 'category', data: days },
      visualMap: {
        type: 'piecewise',
        orient: 'horizontal', left: 'center', bottom: 0,
        itemWidth: 14, itemHeight: 9,
        textStyle: { fontSize: 11 },
        pieces: [
          { gt: 80, label: '极度拥挤 80+', color: '#e53935' },
          { gt: 50, lte: 80, label: '中等拥挤 50-80', color: '#fb923c' },
          { gt: 30, lte: 50, label: '轻微拥挤 30-50', color: '#ffd54f' },
          { lte: 30, label: '舒适 0-30', color: '#a5d6a7' }
        ]
      },
      series: [{
        type: 'heatmap',
        data: data,
        label: { show: true, fontSize: 9, color: '#374151', formatter: function (p) { return p.value[2]; } },
        itemStyle: { borderColor: '#fff', borderWidth: 1, borderRadius: 2 }
      }]
    }, true);
  }

  function refresh() {
    loadRecent().then(function () {
      if (range === 'all') { loadFull().then(render); } else { render(); }
    });
  }

  // 实时直读:打开网页时,当前人数/温湿度每 30 秒直接从商家服务器获取
  function liveTick() {
    fetch(API_URL).then(function (r) { return r.json(); }).then(function (p) {
      if (!p || p.code !== 0 || !p.data) return;
      var env = p.data.environment || {};
      $('#cur').textContent = p.data.occupancyCount;
      $('#upd').textContent = '实时 · 刚刚更新';
      if (env.temperature != null) $('#temp').textContent = env.temperature + '℃';
      if (env.humidity != null) $('#hum').textContent = env.humidity + '%';
      var cl = crowdLevel(p.data.occupancyCount);
      var c = $('#crowd');
      c.style.display = 'flex';
      c.innerHTML = '<span class="dot" style="background:' + cl.dot + '"></span>' + cl.t;
      lastLiveOk = Date.now();
    }).catch(function () {});
  }

  document.getElementById('ranges').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    if (btn.id === 'cmpBtn') {
      compareOn = !compareOn;
      btn.classList.toggle('active', compareOn);
      if (range !== 'all') { render(); } else { loadFull().then(render); }
      return;
    }
    if (btn.id === 'avgBtn') {
      avgOn = !avgOn;
      btn.classList.toggle('active', avgOn);
      if (range !== 'all') { render(); } else { loadFull().then(render); }
      return;
    }
    document.querySelectorAll('#ranges button[data-range]').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    range = btn.dataset.range;
    if (range === 'all') { loadFull().then(render); } else { render(); }
  });

  window.addEventListener('resize', function () { chart1.resize(); chart2.resize(); heatChart.resize(); });
  liveTick();
  setInterval(liveTick, 30 * 1000);
  refresh();
  setInterval(refresh, 2 * 60 * 1000);
})();
</script>
</body>
</html>
